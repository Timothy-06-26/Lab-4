<!DOCTYPE html>
<html lang="en">   
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="app">
<h1> What Should I Eat? </h1>
<p id = "greeting" ></p>

<label for="meal"> Meal time</label>
<select id="meal">
    <option value="auto" selected>Auto (use the clock) </option>
    <option value="breakfast">Breakfast</option>
    <option value="lunch">Lunch</option>
    <option value="supper">Supper</option>
    <option value="latenight">Late night</option>
</select>

<label for="size"> How hungry are you? </label>
<select id="size">
    <option value ="any" selected> Anything goes</option>
    <option value="snack"> Just a snack </option>
    <option value="light"> Light meal </option>
    <option value="big"> Big meal </option>
</select>

<label for="diet"> Diet </label>
<select id = "diet">
    <option value="1">$ - cheap</option>
    <option value="2" selected>$$ - moderate</option>
    <option value="3">$$$ - treat myself</option>
</select>

<button id="findBtn"> Find my food</button>

<div id = "result">
    <div id="emoji"></div>
    <h2 id="dishName"></h2>
    <p id="details"></p>
    <button id = "yesBtn" hidden> Great, Yayy </button>
    <button id = "skipBtn" hidden> Not right now </button>
</div>

<div id = "stats"></div>


<script src="script.js"></script>


        </div>
</body>
</html>
